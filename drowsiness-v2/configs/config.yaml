# ============================================================
# DrowsyGuard v2 — Master Configuration
# All hyper-parameters in one place — no magic numbers in code
# ============================================================

data:
  dataset_dir: "data/raw"
  train_subdir: "train"
  test_subdir: "test"
  categories: ["Closed", "Open"]
  yawn_categories: ["no_yawn", "yawn"]
  img_size: 48
  yawn_img_size: 64
  val_split: 0.2
  random_seed: 42

preprocessing:
  apply_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: [4, 4]
  # Eye augmentation — minority class only
  eye_augment_factor: 3
  # Yawn augmentation — BOTH classes to equal target (bug fix)
  yawn_target_per_class: 2000
  apply_smote: true
  smote_k_neighbors: 5

training:
  batch_size: 64
  epochs: 30
  learning_rate: 1e-3
  l2_regularization: 1e-4
  dropout_rates: [0.2, 0.3, 0.3, 0.4]
  early_stopping_patience: 7
  reduce_lr_patience: 4
  reduce_lr_factor: 0.5

model:
  num_classes: 2
  cbam_ratio: 8
  cbam_kernel: 7
  conv_filters: [32, 64, 128]

inference:
  perclos_window_frames: 90
  # PERCLOS = BOTH eyes closed (fixed from `or` → `and`)
  perclos_both_eyes: true
  perclos_threshold: 0.70
  fusion_eye_weight: 0.6
  fusion_yawn_weight: 0.4
  alert_threshold: 0.65
  warning_threshold: 0.45
  # Mouth cascade detection
  mouth_min_neighbors: 3       # lowered from 5 for better yawn recall
  mouth_min_size: [25, 15]

cascades:
  # haarcascade_mcs_mouth.xml ONLY in 2.4 branch (bug fix)
  mouth_url: "https://raw.githubusercontent.com/opencv/opencv/2.4.13.7/data/haarcascades/haarcascade_mcs_mouth.xml"
  master_url: "https://raw.githubusercontent.com/opencv/opencv/master/data/haarcascades/"
  files:
    - "haarcascade_frontalface_alt.xml"
    - "haarcascade_lefteye_2splits.xml"
    - "haarcascade_righteye_2splits.xml"
    - "haarcascade_mcs_mouth.xml"
  local_dir: "cascades"

paths:
  weights_dir: "models/weights"
  tflite_dir: "models/tflite"
  logs_dir: "logs"
  samples_dir: "data/samples"
  cascades_dir: "cascades"
